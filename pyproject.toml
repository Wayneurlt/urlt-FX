[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-trading-platform"
version = "0.1.0"
description = "Forex trading platform with two independent bots, central risk engine, backtesting and paper trading. Simulation by default."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "cryptography>=43",
  "httpx>=0.27",
  "anthropic>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# The official MetaTrader5 package only works on Windows with an installed terminal.
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading*"]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["trading/tests", "services/api/tests", "tests/integration"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP017", "SIM102", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["trading", "app", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["trading", "services/api/app"]
exclude = ["trading/tests/"]
mypy_path = "services/api"
plugins = ["pydantic.mypy"]
